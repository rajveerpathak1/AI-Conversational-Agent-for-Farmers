<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Farmer Assistant</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {

            background: #f4f7f2;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .chat-container {

            width: 90%;
            max-width: 800px;

            height: 90vh;

            background: white;

            border-radius: 15px;

            display: flex;
            flex-direction: column;

            box-shadow: 0 4px 20px rgba(0,0,0,0.1);

            overflow: hidden;
        }

        .chat-header {

            background: #2e7d32;

            color: white;

            padding: 20px;

            text-align: center;

            font-size: 24px;
            font-weight: bold;
        }

        .chat-box {

            flex: 1;

            padding: 20px;

            overflow-y: auto;

            display: flex;
            flex-direction: column;

            gap: 15px;

            background: #f9faf8;
        }

        .message {

            max-width: 75%;

            padding: 12px 16px;

            border-radius: 12px;

            line-height: 1.5;

            word-wrap: break-word;
        }

        .user {

            align-self: flex-end;

            background: #2e7d32;

            color: white;
        }

        .bot {

            align-self: flex-start;

            background: #e5e7eb;

            color: black;
        }

        .input-container {

            display: flex;

            padding: 15px;

            border-top: 1px solid #ddd;

            background: white;
        }

        #message {

            flex: 1;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 10px;

            outline: none;

            font-size: 16px;
        }

        button {

            margin-left: 10px;

            padding: 12px 20px;

            border: none;

            background: #2e7d32;

            color: white;

            border-radius: 10px;

            cursor: pointer;

            font-size: 16px;

            transition: 0.3s;
        }

        button:hover {

            background: #256628;
        }

        .typing {

            font-style: italic;

            color: gray;
        }

    </style>

</head>

<body>

    <div class="chat-container">

        <div class="chat-header">
            🌾 AI Farmer Assistant
        </div>

        <div class="chat-box" id="chatbox">

            <div class="message bot">
                Hello 👋<br>
                Ask me anything related to crops, farming, irrigation, fertilizers, or agriculture schemes.
            </div>

        </div>

        <div class="input-container">

            <input
                type="text"
                id="message"
                placeholder="Type your question..."
            >

            <button onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>

<script>

async function sendMessage() {

    const inputField =
        document.getElementById("message");

    const message = inputField.value.trim();

    if(message === "") return;

    const chatbox =
        document.getElementById("chatbox");

    chatbox.innerHTML += `
        <div class="message user">
            ${message}
        </div>
    `;

    inputField.value = "";

    chatbox.innerHTML += `
        <div class="message bot typing" id="typing">
            Thinking...
        </div>
    `;

    chatbox.scrollTop = chatbox.scrollHeight;

    try {

        const response = await fetch("/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })

        });

        const data = await response.json();

        document.getElementById("typing").remove();

        chatbox.innerHTML += `
            <div class="message bot">
                ${data.response}
            </div>
        `;

    } catch(error) {

        document.getElementById("typing").remove();

        chatbox.innerHTML += `
            <div class="message bot">
                Error connecting to server.
            </div>
        `;
    }

    chatbox.scrollTop = chatbox.scrollHeight;
}

document.getElementById("message")
.addEventListener("keypress", function(event) {

    if(event.key === "Enter") {
        sendMessage();
    }
});

</script>

</body>
</html>
