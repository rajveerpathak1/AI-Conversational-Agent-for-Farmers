<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Farmer Assistant</title>

    <style>

        * {

            margin: 0;
            padding: 0;

            box-sizing: border-box;

            font-family: Arial, sans-serif;
        }

        body {

            background: #f4f7f2;

            display: flex;

            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .chat-container {

            width: 90%;

            max-width: 850px;

            height: 90vh;

            background: white;

            border-radius: 15px;

            display: flex;

            flex-direction: column;

            box-shadow: 0 4px 20px rgba(0,0,0,0.1);

            overflow: hidden;
        }

        .chat-header {

            background: #2e7d32;

            color: white;

            padding: 20px;

            text-align: center;

            font-size: 24px;

            font-weight: bold;
        }

        .chat-box {

            flex: 1;

            padding: 20px;

            overflow-y: auto;

            display: flex;

            flex-direction: column;

            gap: 15px;

            background: #f9faf8;

            scroll-behavior: smooth;
        }

        .message {

            max-width: 75%;

            padding: 12px 16px;

            border-radius: 12px;

            line-height: 1.6;

            word-wrap: break-word;
        }

        .user {

            align-self: flex-end;

            background: #2e7d32;

            color: white;
        }

        .bot {

            align-self: flex-start;

            background: #e5e7eb;

            color: black;
        }

        .typing {

            font-style: italic;

            color: gray;
        }

        .sources {

            margin-top: 15px;

            padding-top: 10px;

            border-top: 1px solid #ccc;

            font-size: 14px;
        }

        .sources ul {

            margin-top: 8px;

            padding-left: 20px;
        }

        .sources li {

            margin-bottom: 5px;

            color: #2e7d32;
        }

        .input-container {

            display: flex;

            padding: 15px;

            border-top: 1px solid #ddd;

            background: white;
        }

        #message {

            flex: 1;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 10px;

            outline: none;

            font-size: 16px;
        }

        button {

            margin-left: 10px;

            padding: 12px 20px;

            border: none;

            background: #2e7d32;

            color: white;

            border-radius: 10px;

            cursor: pointer;

            font-size: 16px;

            transition: 0.3s;
        }

        button:hover {

            background: #256628;
        }

        button:disabled {

            background: #9e9e9e;

            cursor: not-allowed;
        }

    </style>

</head>

<body>

    <div class="chat-container">

        <div class="chat-header">
            🌾 AI Farmer Assistant
        </div>

        <div
            class="chat-box"
            id="chatbox"
        >

            <div class="message bot">

                Hello 👋

                <br><br>

                Ask me anything related to:
                crops, irrigation, fertilizers,
                farming methods, government schemes,
                soil health, or pesticides.

            </div>

        </div>

        <div class="input-container">

            <input
                type="text"
                id="message"
                placeholder="Ask your farming question..."
            >

            <button id="sendBtn">

                Send

            </button>

        </div>

    </div>

<script>

const sendBtn =
    document.getElementById("sendBtn");

sendBtn.addEventListener(
    "click",
    sendMessage
);

document.getElementById("message")
.addEventListener(
    "keypress",
    function(event) {

        if(event.key === "Enter") {

            sendMessage();
        }
    }
);

async function sendMessage() {

    const inputField =
        document.getElementById("message");

    const message =
        inputField.value.trim();

    if(message === "") return;

    const chatbox =
        document.getElementById("chatbox");

    // User Message
    chatbox.innerHTML += `
        <div class="message user">
            ${message}
        </div>
    `;

    inputField.value = "";

    // Disable Button
    sendBtn.disabled = true;

    // Typing Indicator
    chatbox.innerHTML += `
        <div
            class="message bot typing"
            id="typing"
        >
            Thinking...
        </div>
    `;

    chatbox.scrollTop =
        chatbox.scrollHeight;

    try {

        const response = await fetch(
            "/chat",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                    message: message
                })
            }
        );

        const data = await response.json();

        document
            .getElementById("typing")
            .remove();

        let sourcesHTML = "";

        if(
            data.sources &&
            data.sources.length > 0
        ) {

            sourcesHTML += `
                <div class="sources">

                    <strong>Sources:</strong>

                    <ul>
            `;

            data.sources.forEach(source => {

                sourcesHTML += `
                    <li>${source}</li>
                `;
            });

            sourcesHTML += `
                    </ul>

                </div>
            `;
        }

        chatbox.innerHTML += `
            <div class="message bot">

                <div>
                    ${data.response.replace(/\n/g, "<br>")}
                </div>

                ${sourcesHTML}

            </div>
        `;

    } catch(error) {

        document
            .getElementById("typing")
            .remove();

        chatbox.innerHTML += `
            <div class="message bot">

                Error connecting to server.

            </div>
        `;
    }

    sendBtn.disabled = false;

    chatbox.scrollTop =
        chatbox.scrollHeight;
}

</script>

</body>
</html>
